workflows:
  android-debug:
    name: VIT Blood Bank APK
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Build APK
        script: |
          flutter build apk --debug --android-skip-build-dependency-validation

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
