workflows:
  android-debug:
    name: VIT Blood Bank APK
    max_build_duration: 30
    environment:
      flutter: 3.16.9
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build with Gradle directly
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon
          echo "=== Searching for APK ==="
          find /Users/builder/clone -name "*.apk" 2>/dev/null
          echo "=== Copying APK ==="
          mkdir -p /Users/builder/clone/output
          find /Users/builder/clone -name "*.apk" -exec cp {} /Users/builder/clone/output/ \;
          ls -la /Users/builder/clone/output/
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - output/*.apk
      - "**/*.apk"
