workflows:
  android-debug:
    name: VIT Blood Bank APK
    max_build_duration: 30
    environment:
      flutter: 3.16.9
    scripts:
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation || true
          echo "Finding APK..."
          find /Users/builder/clone/build -name "*.apk" 2>/dev/null || true
          find . -name "*.apk" 2>/dev/null || true
    artifacts:
      - build/**/*.apk
      - build/app/outputs/**/*.apk
      - build/app/outputs/flutter-apk/*.apk
      - "**/*.apk"
