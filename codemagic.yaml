workflows:
  android-debug:
    name: VIT Blood Bank APK
    max_build_duration: 30
    environment:
      flutter: 3.16.9
    scripts:
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
